[project]
name = "supply-chain-arena"
version = "0.1.0"
description = "Your supply chain is a spreadsheet full of guesses. It should be an optimization model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # pin <3: PuLP 4.x is a breaking API rewrite (no PULP_CBC_CMD, new LpVariable);
    # the classic LP/MILP API this project uses lives in the 2.x line.
    "pulp>=2.9,<3",
    "highspy>=1.7",
    "ortools>=9.10",
    "scipy>=1.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
